<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DaltonSpectra - Câmera</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Poppins', sans-serif;
      overflow: hidden; /* Impede rolagens na tela da câmera */
    }

    /* =========================
       ÁREA DE VISUALIZAÇÃO
    ========================== */
    #camera-feed, #photo-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Faz a imagem preencher a tela toda */
      z-index: 1;
    }

    #photo-canvas {
      display: none;
      z-index: 2;
    }

    /* =========================
       RESULTADO TOP (ESTILO IPHONE)
    ========================== */
    .result-badge {
      position: absolute;
      top: 50px; /* Espaço para a barra de status/notch */
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 20;
      padding: 14px 28px;
      border-radius: 40px;
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .result-badge.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.8);
    }

    /* =========================
       CONTROLES INFERIORES
    ========================== */
    .bottom-controls {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      z-index: 10;
      padding: 0 20px;
    }

    /* Botão de Galeria e Flash */
    .side-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s;
    }

    .side-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }

    .side-btn.active-flash {
      color: #f1c40f; /* Amarelo quando o flash está ligado */
    }

    /* Botão de Obturador (Shutter) Branco */
    .shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid transparent;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: 0.2s;
      outline: none;
    }

    .shutter-btn:active {
      transform: scale(0.92);
      background: #e0e0e0;
    }

    /* Botão Fechar / Voltar para Câmera */
    .close-photo-btn {
      position: absolute;
      top: 40px;
      right: 20px;
      z-index: 15;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      display: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <video id="camera-feed" autoplay playsinline></video>
  <canvas id="photo-canvas"></canvas>

  <div id="result-badge" class="result-badge">
    <div id="color-dot" class="color-dot"></div>
    <span id="result-text">Aguardando...</span>
  </div>

  <button id="close-photo-btn" class="close-photo-btn">
    <i class="fas fa-times"></i>
  </button>

  <div id="bottom-controls" class="bottom-controls">
    <input type="file" id="gallery-input" accept="image/*" style="display: none;">
    
    <button id="gallery-btn" class="side-btn">
      <i class="fas fa-image"></i>
    </button>

    <button id="shutter-btn" class="shutter-btn"></button>

    <button id="flash-btn" class="side-btn">
      <i class="fas fa-bolt"></i>
    </button>
  </div>

  <script>
    // Referências dos elementos
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('photo-canvas');
    const ctx = canvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');
    const flashBtn = document.getElementById('flash-btn');
    const galleryBtn = document.getElementById('gallery-btn');
    const galleryInput = document.getElementById('gallery-input');
    const closePhotoBtn = document.getElementById('close-photo-btn');
    const bottomControls = document.getElementById('bottom-controls');
    
    const resultBadge = document.getElementById('result-badge');
    const resultText = document.getElementById('result-text');
    const colorDot = document.getElementById('color-dot');

    let videoStream = null;
    let videoTrack = null;
    let isFlashOn = false;

    // Inicializa a Câmera Traseira
    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = videoStream;
        videoTrack = videoStream.getVideoTracks()[0];
      } catch (err) {
        console.error("Erro ao acessar a câmera: ", err);
        alert("Não foi possível acessar a câmera do dispositivo.");
      }
    }

    startCamera();

    // Ligar / Desligar Flash (Lanterna)
    flashBtn.addEventListener('click', async () => {
      if (videoTrack && videoTrack.getCapabilities().torch) {
        isFlashOn = !isFlashOn;
        try {
          await videoTrack.applyConstraints({
            advanced: [{ torch: isFlashOn }]
          });
          flashBtn.classList.toggle('active-flash', isFlashOn);
        } catch (err) {
          console.error("Erro ao ativar flash: ", err);
        }
      } else {
        alert("O seu dispositivo não suporta o controle do flash pelo navegador.");
      }
    });

    // Abrir Galeria
    galleryBtn.addEventListener('click', () => {
      galleryInput.click();
    });

    galleryInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            showFrozenImage(img);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Tirar a foto
    shutterBtn.addEventListener('click', () => {
      showFrozenImage(video);
    });

    // Função para congelar a imagem na tela e habilitar o toque
    function showFrozenImage(source) {
      canvas.width = video.clientWidth;
      canvas.height = video.clientHeight;

      // Se for a câmera, precisamos cortar a imagem para simular o object-fit: cover
      if (source === video) {
        const videoRatio = video.videoWidth / video.videoHeight;
        const canvasRatio = canvas.width / canvas.height;
        let drawWidth, drawHeight, startX, startY;

        if (videoRatio > canvasRatio) {
          drawHeight = canvas.height;
          drawWidth = video.videoWidth * (canvas.height / video.videoHeight);
          startX = (canvas.width - drawWidth) / 2;
          startY = 0;
        } else {
          drawWidth = canvas.width;
          drawHeight = video.videoHeight * (canvas.width / video.videoWidth);
          startX = 0;
          startY = (canvas.height - drawHeight) / 2;
        }
        ctx.drawImage(source, startX, startY, drawWidth, drawHeight);
      } else {
        // Se veio da galeria
        ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
      }

      // Transição de tela
      video.style.display = 'none';
      canvas.style.display = 'block';
      bottomControls.style.display = 'none';
      closePhotoBtn.style.display = 'block';
      
      showBadge("Toque no objeto", "transparent");
    }

    // Voltar para a câmera ao vivo
    closePhotoBtn.addEventListener('click', () => {
      canvas.style.display = 'none';
      video.style.display = 'block';
      closePhotoBtn.style.display = 'none';
      bottomControls.style.display = 'flex';
      resultBadge.classList.remove('show');
    });

    // Evento Tátil na Foto Congelada (Simulação de envio ao Backend)
    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      // Exibe estado de carregamento
      showBadge("Processando IA...", "gray");

      // AQUI VOCÊ FARÁ O FETCH PARA O FASTAPI (SAM 2 + K-MEANS)
      // fetch('/sua-rota-de-ia', { method: 'POST', body: ... })
      
      // Simulação do retorno do backend após 1.5 segundos
      setTimeout(() => {
        const fakeColorName = "Vermelho Carmesim";
        const fakeHex = "#DC143C"; 
        
        showBadge(fakeColorName, fakeHex);
      }, 1500);
    });

    function showBadge(text, colorHex) {
      resultText.innerText = text;
      colorDot.style.backgroundColor = colorHex;
      colorDot.style.borderColor = colorHex === "transparent" ? "rgba(255,255,255,0.8)" : "#fff";
      resultBadge.classList.add('show');
    }
  </script>
</body>
</html>
